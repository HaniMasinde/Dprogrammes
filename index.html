<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<meta name="theme-color" content="#f4f2e9">
	<title>Silentmover | Daily programmes</title>
	<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
	<link rel="stylesheet" href="list.css">
</head>
<body>
	<main class="page">
		<header>
			<div class="topline">
				<div class="brand" aria-label="Silentmover">
					<span class="brand-mark" aria-hidden="true">H</span>
					<span class="brand-name"><span>Silent</span><span class="brand-name-accent">mover</span></span>
				</div>
				<div class="topline-actions">
					<time id="today"></time>
					<button class="theme-toggle" id="theme-toggle" type="button" aria-label="Switch to dark mode" title="Switch to dark mode" aria-pressed="false">
						<i class="fa-solid fa-moon" id="theme-icon" aria-hidden="true"></i>
					</button>
				</div>
			</div>
			<div class="intro">
				<div>
					<p class="eyebrow">A little structure for today</p>
					<h1>Daily programmes</h1>
					<p class="subtitle">Make room for what matters, one task at a time.</p>
				</div>
				<div class="total" aria-live="polite" aria-atomic="true">
					<strong id="total-count">0</strong>
					<span>total items</span>
				</div>
			</div>
		</header>

		<form class="add-form" id="add-form">
			<label class="sr-only" for="new-task">Add a daily programme</label>
			<input id="new-task" name="task" type="text" maxlength="120" placeholder="Add a programme to your day..." autocomplete="off" required>
			<button type="submit">Add item</button>
		</form>

		<div class="lists">
			<section aria-labelledby="active-heading">
				<div class="section-heading">
					<h2 id="active-heading">On the list</h2>
					<span class="section-count" id="active-count">0 remaining</span>
				</div>
				<ul class="task-list" id="active-list"></ul>
				<p class="empty-state" id="active-empty" hidden>Your day is clear. Add a programme above.</p>
			</section>

			<section class="completed-section" aria-labelledby="completed-heading">
				<div class="section-heading">
					<h2 id="completed-heading">Completed</h2>
					<span class="section-count" id="completed-count">0 done</span>
				</div>
				<ul class="task-list" id="completed-list"></ul>
				<p class="empty-state" id="completed-empty">Finished programmes will appear here.</p>
			</section>
		</div>
	</main>

	<script src="list.js"></script>
</body>
</html>
